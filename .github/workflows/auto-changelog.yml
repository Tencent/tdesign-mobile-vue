name: auto-changelog

on:
  pull_request:
    types: [opened]
    paths: 'package.json'

  issue_comment:
    types: [edited]

jobs:
  generate-changelog:
    if: github.event.pull_request && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/tdesign-changelog-action@next
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          mode: single

  commit-changelog:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/tdesign-changelog-action@next
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          mode: single
